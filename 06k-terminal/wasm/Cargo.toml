# L'interpréteur WebAssembly : une bibliothèque sans bibliothèque standard
# (no_std), qui n'a besoin que de `core` et `alloc` (Vec, Box, String). Elle
# tourne donc aussi bien sur la machine hôte, pour les tests, que dans notre
# noyau. Aucune dépendance.
[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
# Les allocations qui peuvent échouer, et l'Arc faillible du module validé
# (les soldes d'avant 6k).
faillible = { path = "../faillible" }

# Les règles du noyau (../clippy.toml) : aucune allocation qui panique (les
# soldes d'avant 6k).
[lints.clippy]
all = { level = "allow", priority = -1 }
disallowed_methods = "deny"
disallowed_macros = "deny"
