# Les formats de fichiers que lit le noyau : l'archive de programmes (cpio
# « newc », celui de l'initramfs de Linux), les exécutables ELF, la ligne
# de commande de /etc/demarrage, les tables ACPI (6e), l'espace de
# configuration PCI et les en-têtes du réseau (6g). Comme l'interpréteur WebAssembly (../wasm), une
# bibliothèque sans bibliothèque standard (no_std) et sans dépendance,
# testée sur la machine hôte (`make tests-hote`), puis compilée dans le
# noyau. Elle n'a pas besoin d'`alloc` : elle ne fait que lire des octets.
[package]
name = "formats"
version = "0.1.0"
edition = "2024"

[dependencies]

# Les règles du noyau (../clippy.toml) : aucune allocation qui panique (les
# soldes d'avant 6k).
[lints.clippy]
all = { level = "allow", priority = -1 }
disallowed_methods = "deny"
disallowed_macros = "deny"
