# Même version de Rust que le noyau (../noyau) : la bibliothèque est
# compilée dans le noyau. On la teste sur la machine hôte
# (x86_64-unknown-linux-gnu) et on vérifie qu'elle se compile aussi pour la
# cible du noyau.
[toolchain]
channel = "1.99.1"
profile = "minimal"
# clippy (les soldes d'avant 6k) : les règles du noyau, ../clippy.toml.
components = ["clippy"]
targets = ["x86_64-unknown-none"]
