# Intégration continue : à chaque envoi, chaque étape est assemblée puis
# démarrée dans QEMU sans écran ; on vérifie que serial.log contient bien
# chaque ligne de son fichier attendu.txt. Une étape qui a des tests sur la
# machine hôte ou des scénarios de panne les passe aussi (`make tests-hote`,
# `make tests-qemu`, voir verifier.sh).
name: QEMU

on: [push, pull_request]

jobs:
  etapes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # gcc et libc6-dev (la glibc statique, libc.a) : les programmes Linux
      # de test de l'étape 5. Préinstallés sur les machines de GitHub, mais
      # nommés quand même : la CI ne dépend pas de ce qu'elles ont par hasard.
      # netcat-openbsd (nc) : make tests-qemu envoie une touche au moniteur
      # de QEMU par sa socket (6e). Les autres : de quoi compiler QEMU (6h).
      - name: Installer nasm, gcc et les outils pour compiler QEMU
        run: sudo apt-get update && sudo apt-get install -y nasm gcc libc6-dev netcat-openbsd libglib2.0-dev libpixman-1-dev libslirp-dev libncurses-dev libpng-dev ninja-build python3-venv pkg-config flex bison
      # QEMU compilé, pas le paquet d'Ubuntu, dont un bogue fait planter le
      # compilateur à la volée de claude (.devcontainer/construire-qemu.sh) ;
      # gardé d'un envoi à l'autre : sa compilation prend plusieurs minutes.
      - uses: actions/cache@v4
        id: cache-qemu
        with:
          path: ~/qemu
          key: qemu-${{ runner.os }}-${{ hashFiles('.devcontainer/construire-qemu.sh') }}
      - name: Compiler QEMU
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: sh .devcontainer/construire-qemu.sh "$HOME/qemu"
      - name: Mettre QEMU dans le PATH
        run: echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
      # rustup est préinstallé sur les machines de GitHub ; il installe la
      # version de Rust figée dans rust-toolchain.toml, avec la cible du noyau
      # (et clippy, depuis 6h : make le lance, rustup l'ajoute tout seul en
      # lisant le rust-toolchain.toml de l'étape).
      - name: Installer Rust
        run: cd 03-noyau-rust/noyau && rustup toolchain install
      - name: Tester chaque etape
        run: |
          set -o pipefail
          ./verifier.sh 2>&1 | tee verifier.log
      # Les journaux d'une action demandent les droits d'administrateur du
      # dépôt ; ses annotations se lisent sans jeton, par l'API de GitHub
      # (/check-runs/<id>/annotations). Chaque échec y est dit une fois, le
      # détail d'abord : GitHub en garde dix par étape.
      - name: Dire les echecs dans les annotations
        if: failure()
        run: |
          grep -E ': ECHEC$|^ECHEC ' verifier.log | sort -s -t' ' -k1,1r | awk '!vu[$0]++' | sed 's/^/::error::/'
