# Intégration continue : à chaque envoi, chaque étape est assemblée puis
# démarrée dans QEMU sans écran ; on vérifie que serial.log contient bien
# chaque ligne de son fichier attendu.txt. Une étape qui a des tests sur la
# machine hôte ou des scénarios de panne les passe aussi (`make tests-hote`,
# `make tests-qemu`, voir verifier.sh).
name: QEMU

on: [push, pull_request]

jobs:
  etapes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # gcc et libc6-dev (la glibc statique, libc.a) : les programmes Linux
      # de test de l'étape 5. Préinstallés sur les machines de GitHub, mais
      # nommés quand même : la CI ne dépend pas de ce qu'elles ont par hasard.
      # netcat-openbsd (nc) : make tests-qemu envoie une touche au moniteur
      # de QEMU par sa socket (6e). Les autres : de quoi compiler QEMU (6h).
      - name: Installer nasm, gcc et les outils pour compiler QEMU
        run: sudo apt-get update && sudo apt-get install -y nasm gcc libc6-dev netcat-openbsd libglib2.0-dev libpixman-1-dev libslirp-dev libncurses-dev libpng-dev ninja-build python3-venv pkg-config flex bison
      # QEMU compilé, pas le paquet d'Ubuntu, dont un bogue fait planter le
      # compilateur à la volée de claude (.devcontainer/construire-qemu.sh) ;
      # gardé d'un envoi à l'autre : sa compilation prend plusieurs minutes.
      # La version 6 : la 4 tournait sur Node 20, que GitHub retire (un
      # avertissement à chaque envoi) ; la 5 et la 6 tournent sur Node 24,
      # avec les mêmes paramètres, et la 6 est la dernière.
      - uses: actions/cache@v6
        id: cache-qemu
        with:
          path: ~/qemu
          key: qemu-${{ runner.os }}-${{ hashFiles('.devcontainer/construire-qemu.sh') }}
      - name: Compiler QEMU
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: sh .devcontainer/construire-qemu.sh "$HOME/qemu"
      - name: Mettre QEMU dans le PATH
        run: echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
      # rustup est préinstallé sur les machines de GitHub ; il installe la
      # version de Rust figée dans rust-toolchain.toml, avec la cible du noyau
      # (et clippy, depuis 6h : make le lance, rustup l'ajoute tout seul en
      # lisant le rust-toolchain.toml de l'étape).
      - name: Installer Rust
        run: cd 03-noyau-rust/noyau && rustup toolchain install
      # Les paquets figés que téléchargent les étapes, gardés d'un envoi à
      # l'autre : le noyau de référence et ses modules (180 Mo de paquets pour
      # 15 Mo gardés), et la glibc de l'image (depuis 6k). Chacun en trois
      # temps (restore, le téléchargement, save), pas actions/cache seul :
      # celui-ci ne garde rien d'une action rouge, et un test qui échoue
      # faisait tout retélécharger à l'envoi suivant (le 11 novembre 2026, ce
      # fut pendant que Launchpad répondait 503). La clé est tirée des lignes
      # dont dépend ce qui est gardé (les versions, les empreintes, les
      # fichiers retenus), pas des fichiers entiers : un commentaire changé
      # ne retélécharge rien. Le script et le Makefile revérifient les
      # empreintes à chaque lancement : un cache abîmé arrête tout, il n'entre
      # jamais dans une image. Pas claude : actions/cache se lit depuis une
      # demande de fusion venue d'une copie du dépôt (voir le Makefile).
      - name: Cles des paquets figes
        id: cles
        run: |
          echo "linux=$(grep -E '^(VERSION|PAQUET|CONSTRUCTION|SHA256_[A-Z0-9_]+|MODULES)=' .devcontainer/linux-de-reference.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "glibc=$(grep -h -E '^GLIBC_(VERSION|SHA256_[A-Z0-9_]+|FICHIERS) *=' 0*/Makefile | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: linux
        with:
          path: ~/.cache/claude-os/linux-*
          key: linux-de-reference-${{ steps.cles.outputs.linux }}
      # Le script télécharge à son premier lancement : `true` dans la
      # machine, qui prouve aussi qu'elle démarre, avant les tests.
      - name: Telecharger le Linux de reference
        if: steps.linux.outputs.cache-hit != 'true'
        run: .devcontainer/linux-de-reference.sh true
      - uses: actions/cache/save@v6
        if: steps.linux.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/claude-os/linux-*
          key: linux-de-reference-${{ steps.cles.outputs.linux }}
      - uses: actions/cache/restore@v6
        id: glibc
        with:
          path: ~/.cache/claude-os/glibc-*
          key: glibc-${{ steps.cles.outputs.glibc }}
      # Par chaque étape qui la fige (make glibc-figee) : la même révision
      # n'est téléchargée qu'une fois, les suivantes trouvent ses paquets.
      - name: Telecharger la glibc figee
        if: steps.glibc.outputs.cache-hit != 'true'
        run: |
          for m in 0*/Makefile; do
            if grep -q '^glibc-figee:' "$m"; then make -C "$(dirname "$m")" glibc-figee; fi
          done
      - uses: actions/cache/save@v6
        if: steps.glibc.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/claude-os/glibc-*
          key: glibc-${{ steps.cles.outputs.glibc }}
      # Les démarrages et les scénarios de QEMU sur la machine de GitHub ; ses
      # tests sur l'hôte, eux, sous le Linux de référence (6.18), pas celui de
      # la machine (7.0 en novembre 2026, et il changera encore) : ils
      # comparent notre noyau à celui dont nous lisons les sources. verifier.sh
      # les y lance, étape par étape (.devcontainer/linux-de-reference.sh ;
      # KVM, que QEMU ouvre sous root). Cette machine-là a les quatre
      # processeurs de celle de GitHub et 10 de ses 16 Gio.
      - name: Tester chaque etape
        run: |
          set -o pipefail
          MEMOIRE=10G PROCESSEURS=4 ./verifier.sh 2>&1 | tee verifier.log
      # Les journaux d'une action demandent les droits d'administrateur du
      # dépôt ; ses annotations se lisent sans jeton, par l'API de GitHub
      # (/check-runs/<id>/annotations). Chaque échec y est dit une fois, le
      # détail d'abord : GitHub en garde dix par étape. Rien quand une étape
      # d'avant les tests a échoué (apt, un téléchargement) : pas de journal,
      # et GitHub dit déjà laquelle.
      - name: Dire les echecs dans les annotations
        if: failure()
        run: |
          [ -f verifier.log ] || exit 0
          grep -E ': ECHEC$|^ECHEC ' verifier.log | sort -s -t' ' -k1,1r | awk '!vu[$0]++' | sed 's/^/::error::/'
